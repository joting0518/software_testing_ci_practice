name: Calculator Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run tests
        run: python -m unittest -v CalcTest
      
      - name: Install verification tools
        run: python -m pip install coverage ruff

      - name: Static analysis
        run: python -m ruff check Calc.py CalcTest.py

      - name: Run tests with coverage
        run: python -m coverage run --branch --source=Calc -m unittest -v CalcTest

      - name: Check coverage threshold
        run: python -m coverage report -m --fail-under=90